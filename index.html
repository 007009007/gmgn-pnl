<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>GMGN 风格收益图生成器</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #000;
      color: #fff;
      font-family: Arial, sans-serif;
      text-align: center;
    }
    .container {
      padding: 20px;
    }
    input, button {
      padding: 10px;
      margin: 10px;
      font-size: 16px;
    }
    canvas {
      margin-top: 20px;
      border: 1px solid #333;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>GMGN 风格收益图生成器</h1>
    <form id="inputForm">
      <input type="text" id="tokenAddress" placeholder="合约地址（如：So1111...）" required /><br />
      <input type="number" step="0.01" id="gain" placeholder="收益百分比（如：248.65）" required /><br />
      <input type="file" id="avatarUpload" accept="image/*" /><br />
      <input type="text" id="walletAddress" placeholder="钱包地址（如：9fZpJ...m4P）" /><br />
      <button type="submit">生成收益图</button>
    </form>
    <canvas id="outputCanvas" width="1200" height="675"></canvas><br />
    <button onclick="downloadImage()">下载图片</button>
  </div>
  <script src="generator.js"></script>
</body>
</html>
